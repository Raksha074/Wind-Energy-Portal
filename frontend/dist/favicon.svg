<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gridbricks-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" />
  <!-- Wind Turbine Blades -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="0" r="3.5" fill="url(#gridbricks-grad)" />
    <!-- Blade 1 (up) -->
    <path d="M-1.5,0 C-1.5,-8 -4,-18 0,-21 C4,-18 1.5,-8 1.5,0 Z" fill="url(#gridbricks-grad)" opacity="0.95" />
    <!-- Blade 2 (down-right 120 deg) -->
    <path d="M-1.5,0 C-1.5,-8 -4,-18 0,-21 C4,-18 1.5,-8 1.5,0 Z" fill="url(#gridbricks-grad)" opacity="0.95" transform="rotate(120)" />
    <!-- Blade 3 (down-left 240 deg) -->
    <path d="M-1.5,0 C-1.5,-8 -4,-18 0,-21 C4,-18 1.5,-8 1.5,0 Z" fill="url(#gridbricks-grad)" opacity="0.95" transform="rotate(240)" />
    <!-- Center pin -->
    <circle cx="0" cy="0" r="1.5" fill="#f8fafc" />
  </g>
  <!-- Turbine Tower -->
  <path d="M30.5,28 L29,54 L35,54 L33.5,28 Z" fill="#64748b" opacity="0.8" />
  <!-- Wind Swirl Lines -->
  <path d="M8 20 C16 16, 22 24, 28 20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <path d="M38 42 C44 45, 52 40, 56 43" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.75" />
</svg>
